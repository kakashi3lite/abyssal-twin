name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'mission-control/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options:
          - staging
          - production
        default: 'production'

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  # Default to production if not triggered via workflow_dispatch
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
  # NOTE (Phase 6.5+): the dashboard is served from the SAME Access-protected
  # origin as the API via the worker's [assets] binding (see deploy.yml + wrangler
  # .toml). The separate Cloudflare Pages deployment is DEPRECATED — a Pages
  # bundle cannot reach the API (CORS is locked to the Access origin) and the
  # old baked base (api.abyssal-twin.dev) is NXDOMAIN. This workflow now only
  # builds the dashboard as an artifact; the deploy job is a no-op notice.

jobs:
  build:
    name: Build for Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mission-control/package-lock.json

      - name: Clean install dependencies
        working-directory: mission-control
        run: |
          # Remove any corrupted node_modules
          rm -rf node_modules
          # Use npm install with timeout and better network settings
          npm install --prefer-offline --no-audit --progress=false
        env:
          NPM_CONFIG_TIMEOUT: 120000
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Build for Cloudflare
        working-directory: mission-control
        run: npm run build
        env:
          NODE_ENV: production
          # Same-origin (empty) — the bundle is served by the worker's [assets]
          # binding beside the API; a baked cross-origin base would be NXDOMAIN.
          VITE_API_BASE: ''
          VITE_WS_URL: '/ws/live'
          VITE_SSE_URL: '/api/v1/fleet/stream'
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Verify build
        working-directory: mission-control
        run: |
          ls -la dist/
          test -f dist/index.html || (echo "❌ index.html missing" && exit 1)
          test -d dist/assets || (echo "❌ assets folder missing" && exit 1)
          echo "✅ Build verified"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-${{ env.DEPLOY_ENV }}
          path: mission-control/dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: ${{ env.DEPLOY_ENV == 'production' && 'cloudflare-production' || 'cloudflare-staging' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-build-${{ env.DEPLOY_ENV }}
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages (DEPRECATED — worker assets are canonical)
        id: deploy
        working-directory: mission-control
        run: |
          echo "::warning::Separate Cloudflare Pages deployment is DEPRECATED — the"
          echo "::warning::dashboard is served by the worker's [assets] binding beside the API"
          echo "::warning::(deploy.yml). A Pages bundle cannot reach the API (CORS locked to"
          echo "::warning::the Access origin). Skipping Pages deploy; no project created."
          echo "deployment-url=https://abyssal-twin.swanandtanavade100.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Comment deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const env = '${{ env.DEPLOY_ENV }}';
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Cloudflare ${env} deployment ready**\n\n🔗 ${url}`
            });

      - name: Deployment Summary
        run: |
          echo "## 🚀 Cloudflare Pages Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.DEPLOY_ENV }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.deploy.outputs.deployment-url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
