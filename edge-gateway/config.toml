# Abyssal Twin Edge Gateway — Support Vessel Configuration
# Deployed on the support vessel (Jetson Orin or ruggedized x86).

[cloudflare]
# Cloudflare Workers API endpoint (production worker: abyssal-twin)
api_url = "https://abyssal-twin.swanandtanavade100.workers.dev"
# WebSocket endpoint for real-time Durable Object sync
ws_url = "wss://abyssal-twin.swanandtanavade100.workers.dev/ws/live"
# Authentication token (set via CF_API_TOKEN environment variable)
api_token = "${CF_API_TOKEN}"
# Tunnel token for cloudflared (set via CF_TUNNEL_TOKEN env var)
tunnel_token = "${CF_TUNNEL_TOKEN}"

[satellite]
# Conservative Iridium bandwidth limit (kbps)
bandwidth_limit_kbps = 50
# Batch upload interval (seconds) — buffer locally, upload in bursts
batch_interval_seconds = 60
# zstd compression level (22 = max; worth the CPU for expensive satellite bytes)
compression_level = 22
# Maximum buffer size before forced flush (bytes)
max_buffer_bytes = 102400  # 100 KB

[acoustic]
# Zenoh CLIENT config — the gateway connects to the vessel router.
# (Previously pointed at the router-mode acoustic.json5, which made the
# gateway try to bind tcp/7447 itself → "Address already in use".)
zenoh_config = "zenoh-client.json5"
# Local state cache size limit (MB) — buffer during satellite outages
local_cache_size_mb = 500
# Topics to subscribe (Zenoh key expressions)
state_topic = "iort/dt/*/state"
anomaly_topic = "iort/dt/*/anomaly"
federation_topic = "iort/federation/*"

# Per-message HMAC key (C5). Resolved from the ACOUSTIC_HMAC_KEY env var so the
# key never lives in this file. When set, the bridge REQUIRES 57-byte
# HMAC-authenticated frames (Python fleet tier signs with the same key).
# Leave empty for plain 47-byte frames (dev/simulation only).
hmac_key = "${ACOUSTIC_HMAC_KEY}"

[acoustic.tls]
# Zenoh TLS transport (C5): encrypted at the transport layer, ZERO per-message
# overhead (HMAC-8 above remains the per-message integrity layer). All paths
# support ${ENV} references; generate with scripts/ci/generate_zenoh_tls.sh.
# Leave empty to run plaintext (dev/simulation).
root_ca_certificate = "${ZENOH_TLS_ROOT_CA}"
listen_private_key = "${ZENOH_TLS_LISTEN_KEY}"
listen_certificate = "${ZENOH_TLS_LISTEN_CERT}"
enable_mtls = false
connect_private_key = "${ZENOH_TLS_CONNECT_KEY}"
connect_certificate = "${ZENOH_TLS_CONNECT_CERT}"
verify_name_on_connect = true

[gateway]
# Unique identifier for this support vessel
vessel_id = 10
# Local SQLite database path (mirrors D1 schema)
db_path = "/var/lib/abyssal/local_cache.db"
# Log level (trace, debug, info, warn, error)
log_level = "info"
# Heartbeat interval to Cloudflare (seconds)
heartbeat_interval_seconds = 30

[bandwidth_tiers]
# Adaptive sync behavior based on measured satellite bandwidth
# Emergency mode: only anomaly alerts + heartbeats
emergency_threshold_kbps = 10
# Mission monitoring: state at 0.1 Hz
mission_threshold_kbps = 50
# Full telemetry: state at 1 Hz + extended data
full_threshold_kbps = 100
