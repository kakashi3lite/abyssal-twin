# IoRT-DT: Abyssal Twin — Cloudflare Edge Deployment
# Federated Digital Twin infrastructure for AUV fleet operations.
# Support vessel gateway syncs to this global coordinator via satellite.

name = "abyssal-twin"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Keep the *.workers.dev URL active — the edge gateway and the Cloudflare Access
# app both target the workers.dev origin directly.
workers_dev = true

# ─── Static Assets: Mission Control dashboard ───────────────────────────────
# Serves the React dashboard from the SAME Access-protected origin as the API
# (abyssal-twin.dalecabra.com). Same-origin = the Access CF_Authorization cookie
# flows automatically → Access injects the JWT → requireAuth() passes. Zero CORS.
# run_worker_first = true keeps the API routes (worker) winning over assets.
[assets]
directory = "../mission-control/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ─── D1 Database ─────────────────────────────────────────────────────────────
# Fleet state, anomaly events, mission metadata.
# Schema mirrors the local SQLite cache on the support vessel for trivial delta sync.
[[d1_databases]]
binding = "FLEET_DB"
database_name = "abyssal-fleet"
database_id = "0d8c0084-de50-42a6-bf07-56d5ba4ff3b0" # provisioned 2026-08-07
migrations_dir = "migrations"

# ─── R2 Object Storage ──────────────────────────────────────────────────────
# ROS2 bag files, compressed mission logs, audit trail.
# $0.015/GB-month — target <$10/month for typical 30-day, 3-AUV mission.
[[r2_buckets]]
binding = "MISSION_STORE"
bucket_name = "abyssal-missions"

# ─── Durable Objects ────────────────────────────────────────────────────────
# Singleton federation coordinator: gossip WebSocket endpoint, state checkpoint.
# Uses Hibernation API to minimize cost during idle ocean missions.
[[durable_objects.bindings]]
name = "FEDERATION_COORDINATOR"
class_name = "FederationCoordinator"

# Workers Free plan requires SQLite-backed Durable Objects (new_sqlite_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FederationCoordinator"]

# ─── Environment Variables ──────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
# Conservative Iridium satellite bandwidth limit (kbps)
SATELLITE_BANDWIDTH_LIMIT_KBPS = "50"
# Batch upload interval from vessel (seconds)
BATCH_INTERVAL_SECONDS = "60"
# Cloudflare Access application AUD tag — set to the Access app's AUD for staging/production.
ACCESS_AUD = "a3b81afd706fb532bda52de8cb1d3c2db0b4bdead8721ecab4a641d60f8165f4"
# Pinned Access JWT issuer — the Access-protected host serving /cdn-cgi/access/certs.
# The worker fetches JWKS ONLY from this issuer (never from a token's `iss`).
ACCESS_ISSUER = "https://abyssal-twin.dalecabra.com"
# Locked to the live Access-protected dashboard origin (never * in production).
ALLOWED_ORIGIN = "https://abyssal-twin.dalecabra.com"
# NOTE: INGEST_TOKEN must NOT appear in [vars] — a var with the same name would
# OVERRIDE the secret. Production value lives in the INGEST_TOKEN secret
# (set via `wrangler secret put INGEST_TOKEN`), and must equal the gateway's
# CF_API_TOKEN. Dev/test value is in [env.dev.vars] only.

# ═════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT: development (local testing)
# ═════════════════════════════════════════════════════════════════════════════
[env.dev]
name = "abyssal-twin-dev"

[[env.dev.d1_databases]]
binding = "FLEET_DB"
database_name = "abyssal-fleet-dev"
database_id = ""                     # Set via: wrangler d1 create abyssal-fleet-dev
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "MISSION_STORE"
bucket_name = "abyssal-missions-dev"

[[env.dev.durable_objects.bindings]]
name = "FEDERATION_COORDINATOR"
class_name = "FederationCoordinator"

[env.dev.vars]
ENVIRONMENT = "development"
SATELLITE_BANDWIDTH_LIMIT_KBPS = "1000"
BATCH_INTERVAL_SECONDS = "10"
# Wildcard is acceptable for local development only
ALLOWED_ORIGIN = "*"
ACCESS_AUD = "a3b81afd706fb532bda52de8cb1d3c2db0b4bdead8721ecab4a641d60f8165f4"
ACCESS_ISSUER = "https://abyssal-twin.dalecabra.com"
INGEST_TOKEN = "dev-ingest-token-change-me"

# ═════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT: staging (pre-production validation)
# ═════════════════════════════════════════════════════════════════════════════
[env.staging]
name = "abyssal-twin-staging"

[[env.staging.d1_databases]]
binding = "FLEET_DB"
database_name = "abyssal-fleet-staging"
database_id = ""                     # Set via: wrangler d1 create abyssal-fleet-staging
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "MISSION_STORE"
bucket_name = "abyssal-missions-staging"

[[env.staging.durable_objects.bindings]]
name = "FEDERATION_COORDINATOR"
class_name = "FederationCoordinator"

[env.staging.vars]
ENVIRONMENT = "staging"
SATELLITE_BANDWIDTH_LIMIT_KBPS = "100"
BATCH_INTERVAL_SECONDS = "30"
ALLOWED_ORIGIN = "https://staging.abyssal-twin.dev"
ACCESS_AUD = "a3b81afd706fb532bda52de8cb1d3c2db0b4bdead8721ecab4a641d60f8165f4"
ACCESS_ISSUER = "https://staging.abyssal-twin.dev"

# ═════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT: production (live AUV operations)
# ═════════════════════════════════════════════════════════════════════════════
[env.production]
name = "abyssal-twin"

[[env.production.d1_databases]]
binding = "FLEET_DB"
database_name = "abyssal-fleet"
database_id = "0d8c0084-de50-42a6-bf07-56d5ba4ff3b0" # provisioned 2026-08-07
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "MISSION_STORE"
bucket_name = "abyssal-missions"

[[env.production.durable_objects.bindings]]
name = "FEDERATION_COORDINATOR"
class_name = "FederationCoordinator"

[env.production.vars]
ENVIRONMENT = "production"
SATELLITE_BANDWIDTH_LIMIT_KBPS = "50"
BATCH_INTERVAL_SECONDS = "60"
# Locked to the live Access-protected dashboard origin — never use * in production
ALLOWED_ORIGIN = "https://abyssal-twin.dalecabra.com"
ACCESS_AUD = "a3b81afd706fb532bda52de8cb1d3c2db0b4bdead8721ecab4a641d60f8165f4"
ACCESS_ISSUER = "https://abyssal-twin.dalecabra.com"
# Production INGEST_TOKEN is injected via `wrangler secret put INGEST_TOKEN`.
# The gateway's CF_API_TOKEN must equal it (see config.toml).
